[project]
name = "data-engine-api"
version = "0.1.0"
description = "Bobomurod's question generation, validation, and IRT calibration backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "arq>=0.26",
    "redis[hiredis]>=5.2",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "languagepro-common",
    "languagepro-llm",
    "languagepro-irt",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_engine"]

[tool.uv.sources]
languagepro-common = { workspace = true }
languagepro-llm = { workspace = true }
languagepro-irt = { workspace = true }
