name: aiexam-dev

x-api-env: &api-env
  AUTH_API_URL: http://auth-api:8000
  DATA_ENGINE_API_URL: http://data-engine-api:8000
  EXAM_PLATFORM_API_URL: http://exam-platform-api:8000
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-languagepro}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-languagepro}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  PROMPTS_DIR: /app/prompts
  AUTH_REFRESH_COOKIE_PATH: /auth/v1/refresh

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-languagepro}
      POSTGRES_USER: ${POSTGRES_USER:-languagepro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-languagepro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin_change_in_prod}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin_change_in_prod};
      mc mb -p local/${S3_BUCKET_AUDIO:-audio-recordings} || true;
      mc mb -p local/${S3_BUCKET_PROMPTS:-audio-prompts} || true;
      mc mb -p local/${S3_BUCKET_CERTIFICATES:-certificates} || true;
      mc mb -p local/${S3_BUCKET_EXPORTS:-exports} || true;
      exit 0;
      "

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - postgres
      - redis

  auth-api:
    build:
      context: ../..
      dockerfile: infra/docker/python-api.Dockerfile
      args:
        SERVICE_NAME: auth-api
        SERVICE_MODULE: auth_api
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8000"
    volumes:
      - ../../apps/auth-api:/app/apps/auth-api
      - ../../python:/app/python
    environment:
      <<: *api-env
      SERVICE_NAME: auth-api

  data-engine-api:
    build:
      context: ../..
      dockerfile: infra/docker/python-api.Dockerfile
      args:
        SERVICE_NAME: data-engine-api
        SERVICE_MODULE: data_engine
    restart: unless-stopped
    env_file: ../../.env
    environment:
      <<: *api-env
      SERVICE_NAME: data-engine-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/data-engine-api:/app/apps/data-engine-api
      - ../../python:/app/python
      - ../../prompts:/app/prompts

  data-engine-worker:
    build:
      context: ../..
      dockerfile: infra/docker/python-api.Dockerfile
      args:
        SERVICE_NAME: data-engine-api
        SERVICE_MODULE: data_engine
    restart: unless-stopped
    command: ["uv", "run", "arq", "data_engine.jobs.WorkerSettings"]
    env_file: ../../.env
    environment:
      <<: *api-env
      SERVICE_NAME: data-engine-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/data-engine-api:/app/apps/data-engine-api
      - ../../python:/app/python
      - ../../prompts:/app/prompts

  exam-platform-api:
    build:
      context: ../..
      dockerfile: infra/docker/python-api.Dockerfile
      args:
        SERVICE_NAME: exam-platform-api
        SERVICE_MODULE: exam_platform
    restart: unless-stopped
    env_file: ../../.env
    environment:
      <<: *api-env
      SERVICE_NAME: exam-platform-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ../../apps/exam-platform-api:/app/apps/exam-platform-api
      - ../../python:/app/python
      - ../../prompts:/app/prompts

  exam-platform-worker:
    build:
      context: ../..
      dockerfile: infra/docker/python-worker.Dockerfile
      args:
        SERVICE_NAME: exam-platform-api
        SERVICE_MODULE: exam_platform
    restart: unless-stopped
    command: ["uv", "run", "arq", "exam_platform.jobs.WorkerSettings"]
    env_file: ../../.env
    environment:
      <<: *api-env
      SERVICE_NAME: exam-platform-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/exam-platform-api:/app/apps/exam-platform-api
      - ../../python:/app/python
      - ../../prompts:/app/prompts

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
