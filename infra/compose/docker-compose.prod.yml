name: aiexam-prod

x-api-env: &api-env
  AUTH_API_URL: http://auth-api:8000
  DATA_ENGINE_API_URL: http://data-engine-api:8000
  EXAM_PLATFORM_API_URL: http://exam-platform-api:8000
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-languagepro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-languagepro}
  REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
  S3_ENDPOINT: http://minio:9000
  PROMPTS_DIR: /app/prompts
  AUTH_REFRESH_COOKIE_PATH: /api/auth/v1/refresh

x-next-build-args: &next-build-args
  NEXT_PUBLIC_AUTH_API: https://app.aiexam.uz/api/auth
  NEXT_PUBLIC_DATA_API: https://admin.aiexam.uz/api/data
  NEXT_PUBLIC_EXAM_API: https://app.aiexam.uz/api/exam
  NEXT_PUBLIC_LANDING_URL: https://aiexam.uz
  NEXT_PUBLIC_EXAM_WEB_URL: https://app.aiexam.uz
  NEXT_PUBLIC_ADMIN_WEB_URL: https://admin.aiexam.uz

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-languagepro}
      POSTGRES_USER: ${POSTGRES_USER:-languagepro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-languagepro}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb -p local/${S3_BUCKET_AUDIO:-audio-recordings} || true;
      mc mb -p local/${S3_BUCKET_PROMPTS:-audio-prompts} || true;
      mc mb -p local/${S3_BUCKET_CERTIFICATES:-certificates} || true;
      mc mb -p local/${S3_BUCKET_EXPORTS:-exports} || true;
      exit 0;
      "

  auth-api:
    build:
      context: ../..
      dockerfile: infra/docker/python-api.Dockerfile
      args:
        SERVICE_NAME: auth-api
        SERVICE_MODULE: auth_api
    restart: unless-stopped
    env_file: ../../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      <<: *api-env
      SERVICE_NAME: auth-api
    command: ["sh", "-c", "uv run uvicorn auth_api.main:app --host 0.0.0.0 --port 8000 --workers 2"]
    deploy:
      resources:
        limits:
          memory: 512M

  data-engine-api:
    build:
      context: ../..
      dockerfile: infra/docker/python-api.Dockerfile
      args:
        SERVICE_NAME: data-engine-api
        SERVICE_MODULE: data_engine
    restart: unless-stopped
    env_file: ../../.env.production
    environment:
      <<: *api-env
      SERVICE_NAME: data-engine-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../../prompts:/app/prompts:ro
    command: ["sh", "-c", "uv run uvicorn data_engine.main:app --host 0.0.0.0 --port 8000 --workers 2"]
    deploy:
      resources:
        limits:
          memory: 1G

  data-engine-worker:
    build:
      context: ../..
      dockerfile: infra/docker/python-api.Dockerfile
      args:
        SERVICE_NAME: data-engine-api
        SERVICE_MODULE: data_engine
    restart: unless-stopped
    command: ["uv", "run", "arq", "data_engine.jobs.WorkerSettings"]
    env_file: ../../.env.production
    environment:
      <<: *api-env
      SERVICE_NAME: data-engine-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../prompts:/app/prompts:ro
    deploy:
      resources:
        limits:
          memory: 1G

  exam-platform-api:
    build:
      context: ../..
      dockerfile: infra/docker/python-api.Dockerfile
      args:
        SERVICE_NAME: exam-platform-api
        SERVICE_MODULE: exam_platform
    restart: unless-stopped
    env_file: ../../.env.production
    environment:
      <<: *api-env
      SERVICE_NAME: exam-platform-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ../../prompts:/app/prompts:ro
    command: ["sh", "-c", "uv run uvicorn exam_platform.main:app --host 0.0.0.0 --port 8000 --workers 2"]
    deploy:
      resources:
        limits:
          memory: 1G

  exam-platform-worker:
    build:
      context: ../..
      dockerfile: infra/docker/python-worker.Dockerfile
      args:
        SERVICE_NAME: exam-platform-api
        SERVICE_MODULE: exam_platform
    restart: unless-stopped
    command: ["uv", "run", "arq", "exam_platform.jobs.WorkerSettings"]
    env_file: ../../.env.production
    environment:
      <<: *api-env
      SERVICE_NAME: exam-platform-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../prompts:/app/prompts:ro
    deploy:
      resources:
        limits:
          memory: 1G

  landing:
    build:
      context: ../..
      dockerfile: infra/docker/next-prod.Dockerfile
      args:
        APP_NAME: landing
        APP_PORT: "3000"
        <<: *next-build-args
    restart: unless-stopped
    user: root
    env_file: ../../.env.production
    environment:
      NODE_ENV: production
    command: ["sh", "-c", "pnpm --filter landing start"]
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M

  exam-platform-web:
    build:
      context: ../..
      dockerfile: infra/docker/next-prod.Dockerfile
      args:
        APP_NAME: exam-platform-web
        APP_PORT: "3001"
        <<: *next-build-args
    restart: unless-stopped
    user: root
    env_file: ../../.env.production
    environment:
      NODE_ENV: production
    command: ["sh", "-c", "pnpm --filter exam-platform-web start"]
    ports:
      - "127.0.0.1:3001:3001"
    deploy:
      resources:
        limits:
          memory: 512M

  data-engine-web:
    build:
      context: ../..
      dockerfile: infra/docker/next-prod.Dockerfile
      args:
        APP_NAME: data-engine-web
        APP_PORT: "3002"
        <<: *next-build-args
    restart: unless-stopped
    user: root
    env_file: ../../.env.production
    environment:
      NODE_ENV: production
    command: ["sh", "-c", "pnpm --filter data-engine-web start"]
    ports:
      - "127.0.0.1:3002:3002"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres-data:
  redis-data:
  minio-data:
