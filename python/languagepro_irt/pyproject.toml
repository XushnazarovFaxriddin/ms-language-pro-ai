[project]
name = "languagepro-irt"
version = "0.1.0"
description = "2PL IRT engine: cold-start, theta update, Fisher information selector"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.9",
]

[project.optional-dependencies]
calibration = [
    "py-irt>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/languagepro_irt"]
