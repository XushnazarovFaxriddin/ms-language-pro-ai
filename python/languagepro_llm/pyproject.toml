[project]
name = "languagepro-llm"
version = "0.1.0"
description = "LLM Router: openai SDK pointed at Gemini OpenAI-compat endpoint, prompt registry, cost log"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.55",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "redis[hiredis]>=5.2",
    "tenacity>=9.0",
    "languagepro-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/languagepro_llm"]

[tool.uv.sources]
languagepro-common = { workspace = true }
