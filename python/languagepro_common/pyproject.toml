[project]
name = "languagepro-common"
version = "0.1.0"
description = "Shared utilities: settings, db, logging, auth middleware, errors"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "ulid-py>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/languagepro_common"]
