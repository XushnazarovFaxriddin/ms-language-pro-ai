[project]
name = "languagepro-monorepo"
version = "0.1.0"
description = "LanguagePro AI — IELTS/CEFR AI assessment platform monorepo (Python workspace root)"
requires-python = ">=3.12"
dependencies = [
    "auth-api",
    "data-engine-api",
    "exam-platform-api",
    "languagepro-common",
    "languagepro-llm",
    "languagepro-irt",
    "reportlab>=4.5.0",
    "redis>=5.3.1",
]

[tool.uv.workspace]
members = [
    "apps/auth-api",
    "apps/data-engine-api",
    "apps/exam-platform-api",
    "python/languagepro_llm",
    "python/languagepro_irt",
    "python/languagepro_common",
]

[tool.uv.sources]
auth-api = { workspace = true }
data-engine-api = { workspace = true }
exam-platform-api = { workspace = true }
languagepro-llm = { workspace = true }
languagepro-irt = { workspace = true }
languagepro-common = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/exam-platform-api/tests", "apps/data-engine-api/tests", "apps/auth-api/tests"]
addopts = "-v --strict-markers"
pythonpath = [
    "apps/auth-api/src",
    "apps/data-engine-api/src",
    "apps/exam-platform-api/src",
    "python/languagepro_common/src",
    "python/languagepro_llm/src",
    "python/languagepro_irt/src",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
